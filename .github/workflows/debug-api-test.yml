name: Debug Travelpayouts API

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Testar rotas conhecidas e a rota real
        env:
          TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          test_route() {
            origin=$1
            destination=$2
            echo "=== $origin -> $destination ==="
            curl -s -G "https://api.travelpayouts.com/v1/prices/month-matrix" \
              --data-urlencode "currency=brl" \
              --data-urlencode "origin=$origin" \
              --data-urlencode "destination=$destination" \
              --data-urlencode "month=2027-01-01" \
              --data-urlencode "show_to_affiliates=true" \
              --data-urlencode "one_way=false" \
              -H "X-Access-Token: $TOKEN" \
              -w "\nHTTP_STATUS:%{http_code}\n" | head -c 1000
            echo
          }
          test_route GRU MIA
          test_route GRU LIS
          test_route MAO GRU
          test_route MAO MIA
