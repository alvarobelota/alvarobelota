name: Debug Sky Scrapper API

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver aeroportos (tipo AIRPORT) e testar busca
        env:
          KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python3 <<'PYEOF'
          import json
          import urllib.request
          import urllib.parse
          import os

          KEY = os.environ["KEY"]
          HOST = "sky-scrapper.p.rapidapi.com"

          def get(path, params):
              url = f"https://{HOST}{path}?{urllib.parse.urlencode(params)}"
              req = urllib.request.Request(url, headers={
                  "X-RapidAPI-Key": KEY,
                  "X-RapidAPI-Host": HOST,
              })
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status, json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read())

          def resolve_airport(query):
              status, payload = get("/api/v1/flights/searchAirport", {"query": query, "locale": "en-US"})
              for item in payload.get("data", []):
                  nav = item["navigation"]
                  if nav["entityType"] == "AIRPORT":
                      params = nav["relevantFlightParams"]
                      return params["skyId"], params["entityId"]
              raise RuntimeError(f"Nenhum AIRPORT encontrado pra {query}: {payload}")

          gru_sky, gru_entity = resolve_airport("Sao Paulo Guarulhos")
          print(f"GRU: skyId={gru_sky} entityId={gru_entity}")
          mia_sky, mia_entity = resolve_airport("Miami")
          print(f"MIA: skyId={mia_sky} entityId={mia_entity}")

          status, payload = get("/api/v2/flights/searchFlightsWebComplete", {
              "originSkyId": gru_sky,
              "destinationSkyId": mia_sky,
              "originEntityId": gru_entity,
              "destinationEntityId": mia_entity,
              "cabinClass": "economy",
              "adults": 1,
              "sortBy": "price_low",
              "currency": "BRL",
              "market": "BR",
              "countryCode": "BR",
              "date": "2026-10-15",
          })
          print(f"HTTP {status}")
          print(json.dumps(payload)[:2500])
          PYEOF
