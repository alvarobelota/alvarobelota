name: Debug Sky Scrapper API

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Testar busca de voo ida e volta
        env:
          KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          curl -s -G "https://sky-scrapper.p.rapidapi.com/api/v2/flights/searchFlightsWebComplete" \
            --data-urlencode "originSkyId=MAO" \
            --data-urlencode "destinationSkyId=MCO" \
            --data-urlencode "originEntityId=95674366" \
            --data-urlencode "destinationEntityId=95674009" \
            --data-urlencode "cabinClass=economy" \
            --data-urlencode "adults=1" \
            --data-urlencode "sortBy=cheapest" \
            --data-urlencode "currency=BRL" \
            --data-urlencode "market=BR" \
            --data-urlencode "countryCode=BR" \
            --data-urlencode "date=2027-01-15" \
            --data-urlencode "returnDate=2027-01-25" \
            -H "X-RapidAPI-Key: $KEY" \
            -H "X-RapidAPI-Host: sky-scrapper.p.rapidapi.com" \
            -w "\nHTTP_STATUS:%{http_code}\n" | head -c 3000
          echo
