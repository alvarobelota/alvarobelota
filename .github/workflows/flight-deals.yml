name: Flight deals check

on:
  schedule:
    - cron: "0 11 * * *" # todo dia às 11:00 UTC (~08:00 em BRT)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar ofertas
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m flightdeals.main

      - name: Salvar estado de ofertas já vistas
        run: |
          if ! git diff --quiet -- seen_deals.json; then
            git config user.name "flight-deals-bot"
            git config user.email "actions@github.com"
            git add seen_deals.json
            git commit -m "chore: atualiza ofertas já notificadas"
            git push
          fi
