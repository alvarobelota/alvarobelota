# Copie este arquivo para config.yaml e ajuste com os seus critérios de busca.

origin: GRU               # código IATA da origem (ex: GRU, GIG, MAO)
currency: brl

destinations:
  - code: LIS
    name: Lisboa
    price_threshold_brl: 3000   # avisa quando achar ida-e-volta igual ou abaixo disso
  - code: MAD
    name: Madrid
    price_threshold_brl: 3000

date_range:
  start: 2026-10-01      # início do período em que você pode viajar
  end: 2026-12-31        # fim do período

one_way: false             # false = ida e volta, true = só ida

check_frequency_hours: 24  # de quantas em quantas horas o app deve checar
