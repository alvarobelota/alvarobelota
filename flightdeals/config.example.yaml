# Copie este arquivo para config.yaml e ajuste com os seus critérios de busca.

origin: GRU               # código IATA da origem (ex: GRU, GIG, MAO)
currency: brl

destination:
  code: LIS
  name: Lisboa

# Janelas de data testadas (ida e volta). Cada janela = 1 chamada na SerpApi.
# Cota grátis é 100/mês, então mantenha poucas janelas e frequência baixa.
date_windows:
  - depart: 2026-10-01
    return: 2026-10-11
  - depart: 2026-11-01
    return: 2026-11-11

price_threshold_brl: 3000  # avisa quando achar ida-e-volta igual ou abaixo disso

check_frequency_hours: 168  # de quantas em quantas horas o app deve checar
