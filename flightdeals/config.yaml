# Critérios de busca do Álvaro. Não tem segredo aqui, então fica versionado normalmente.

origin: MAO               # Manaus (AM) - Aeroporto Eduardo Gomes
currency: brl

destination:
  code: MCO
  name: Orlando

# Janelas de data testadas (ida e volta ~10 dias, espalhadas de jan a abr/2027).
# Cada janela = 1 chamada na SerpApi. Cota grátis é 100/mês, então mantemos
# poucas janelas e frequência semanal (ver check_frequency_hours abaixo).
date_windows:
  - depart: 2027-01-01
    return: 2027-01-11
  - depart: 2027-01-15
    return: 2027-01-25
  - depart: 2027-02-01
    return: 2027-02-11
  - depart: 2027-02-15
    return: 2027-02-25
  - depart: 2027-03-01
    return: 2027-03-11
  - depart: 2027-03-15
    return: 2027-03-25
  - depart: 2027-04-01
    return: 2027-04-11
  - depart: 2027-04-15
    return: 2027-04-25

price_threshold_brl: 3800  # avisa quando achar ida-e-volta igual ou abaixo disso

check_frequency_hours: 168  # 1x por semana (pra caber na cota gratis de 100/mes)
